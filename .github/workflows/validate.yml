name: Validate ITD5 Agentic Stack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate JSON configuration
        run: |
          set -euo pipefail
          find companies -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Validate Compose file
        env:
          BETTER_AUTH_SECRET: ci-only-secret
          PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ci-only-signing-secret
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
          
